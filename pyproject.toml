[project]
name = "gistlattice"
version = "0.1.0"
description = "GistLattice is a memory-augmented Python library with episodic recall, semantic state, and durable consolidation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
openai = [
    "openai",
]
anthropic = [
    "anthropic",
]
gemini = [
    "google-genai",
]
ollama = [
    "ollama",
]
qdrant = [
    "qdrant-client>=1.18.0",
]
redis = [
    "redis>=5.0.0",
]
neo4j = [
    "neo4j>=6.2.0",
]
