[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gistlattice"
version = "1.2.4"
description = "GistLattice is a memory-augmented Python library with episodic recall, semantic state, and durable consolidation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
]

[project.scripts]
gistlattice-worker = "gistlattice.worker:main"

[project.optional-dependencies]
openai = [
    "openai",
]
anthropic = [
    "anthropic",
]
gemini = [
    "google-genai",
]
ollama = [
    "ollama",
]
postgres = [
    "asyncpg",
]
redis = [
    "redis>=5.0.0",
]
neo4j = [
    "neo4j>=6.2.0",
]
